[project]
name = "claude-bdd"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest", "pytest-bdd>=8"]

[tool.uv]
package = false
# claude plugin eval refuses hard-linked files anywhere in the plugin dir, .venv included
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "features/"
# pytest-bdd turns the @R/@B ID tags into marks; they are IDs, not markers to register
filterwarnings = ["ignore::pytest.PytestUnknownMarkWarning"]
