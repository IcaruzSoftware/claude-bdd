schema_version: '1.1'
name: formulate:B34.3
description: Open work keeps the scratchpad (features/formulate.feature @B34.3)
tags:
- formulate
- R34
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /bdd:formulate docs/discovery/2026-10-13-workouts.md Yes, I reviewed features/workouts.feature and confirm it.
  max_turns: 15
graders:
- name: says-scratchpad-kept
  type: regex
  pattern: 'Scratchpad kept: R4 still open \(@wip\)\.'
  target: last_message
- name: scratchpad-not-deleted
  type: tool_used
  tool: Bash
  input_match: \brm\b
  min: 0
  max: 0
