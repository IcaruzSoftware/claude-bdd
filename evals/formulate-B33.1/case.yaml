schema_version: '1.1'
name: formulate:B33.1
description: A rule tag (features/formulate.feature @B33.1)
tags:
- formulate
- R33
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /bdd:formulate docs/discovery/2026-10-13-workouts.md
  max_turns: 15
graders:
- name: tag-above-rule-and-clean-title
  type: regex
  pattern: '^\s*@R1\s*\n\s*Rule: Coaches see only their group''s workouts\s*$'
  flags: m
  target:
    source: file
    path: features/workouts.feature
- name: no-id-in-rule-titles
  type: regex
  pattern: ^\s*Rule:[^\n]*\bR\d+\b
  flags: m
  match: not_contains
  target:
    source: file
    path: features/workouts.feature
