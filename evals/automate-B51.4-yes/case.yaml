schema_version: "1.1"
name: automate:B51.4-yes
description: "The user asks for a runner in a project with a plain suite, after a yes (features/automate.feature @B51.4)"
tags: [automate, R51]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/bdd:automate features/workouts.feature (use pytest-bdd; yes, add it as a dev dependency)'
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: adds-pytest-bdd
    type: regex
    target: {source: file, path: pyproject.toml}
    pattern: 'pytest-bdd'
    match: contains
  - name: writes-pytest-bdd-steps
    type: tool_used
    tool: Write
    input_match: 'from pytest_bdd import'
    min: 1
