schema_version: '1.1'
name: discover:B17.1
description: A concrete example title (features/discover.feature @B17.1)
tags:
- discover
- R17
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /bdd:discover coaches see only the workouts of athletes in their own group
  max_turns: 15
graders:
- name: example-with-names
  type: tool_used
  tool: Write
  input_match: B\d+\.\d+ The one where (?:coach |athlete |admin )?[A-Z][a-z]+
  min: 1
- name: no-untitled-example
  type: tool_used
  tool: Write
  input_match: '- B\d+\.\d+ (?!The one where)'
  min: 0
  max: 0
- name: no-generic-example
  type: tool_used
  tool: Write
  input_match: 'B\d+\.\d+ The one where (?:an?|some|another) '
  min: 0
  max: 0
