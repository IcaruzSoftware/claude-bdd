schema_version: '1.1'
name: formulate:B34.1
description: The scratchpad goes away (features/formulate.feature @B34.1)
tags:
- formulate
- R34
- needs-bash
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /bdd:formulate docs/discovery/2026-10-13-workouts.md I reviewed features/workouts.feature and confirm it. Yes, delete the scratchpad.
  max_turns: 15
graders:
- name: scratchpad-deleted
  type: tool_used
