  input_match: \brm\b[^"]*2026-10-13-workouts\.md
  min: 1
- name: reasons-under-every-rule
  type: regex
  pattern: ^\s*Rule:[^\n]*\n[ \t]*[A-Za-z(][^\n]*
  flags: m
  match: count:3
  target:
    source: file
    path: features/workouts.feature
