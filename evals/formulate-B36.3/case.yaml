schema_version: '1.1'
name: formulate:B36.3
description: A split story (features/formulate.feature @B36.3)
tags:
- formulate
- R36
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /bdd:formulate docs/discovery/2026-10-13-workouts.md
  max_turns: 15
graders:
- name: access-feature-exists
  type: file_exists
  path: features/workouts-access.feature
  exists: true
- name: admin-feature-exists
  type: file_exists
  path: features/workouts-admin.feature
  exists: true
- name: no-workouts-feature
  type: file_exists
  path: features/workouts.feature
  exists: false
- name: access-has-r1-r2-and-examples
  type: regex
  pattern: '@R1\s+Rule:[\s\S]*@B1\.1[\s\S]*@B1\.2[\s\S]*@R2\s+Rule:[\s\S]*@B2\.1'
  target:
    source: file
    path: features/workouts-access.feature
- name: access-has-no-r3
  type: regex
  pattern: '@R3\b|@B3\.'
  match: not_contains
  target:
    source: file
    path: features/workouts-access.feature
- name: admin-has-r3-and-examples
  type: regex
  pattern: '@R3\s+Rule:[\s\S]*@B3\.1[\s\S]*@B3\.2'
  target:
    source: file
    path: features/workouts-admin.feature
- name: admin-has-no-r1-r2
  type: regex
  pattern: '@R[12]\b|@B[12]\.'
  match: not_contains
  target:
    source: file
    path: features/workouts-admin.feature
