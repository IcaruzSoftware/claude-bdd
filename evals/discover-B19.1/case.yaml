schema_version: '1.1'
name: discover:B19.1
description: A rule changes in an existing feature (features/discover.feature @B19.1)
tags:
- discover
- R19
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /bdd:discover coaches should also see the workouts of their substitutes' groups
  max_turns: 15
graders:
- name: scratchpad-covers-change
  type: tool_used
  tool: Write
  input_match: '# Example Map[\s\S]*substitut'
  min: 1
- name: unchanged-rules-not-repeated
  type: tool_used
  tool: Write
  input_match: '### R\d+ [^\\]*(?:Athletes see only their own workouts|Only admins can delete workouts)'
  min: 0
  max: 0
