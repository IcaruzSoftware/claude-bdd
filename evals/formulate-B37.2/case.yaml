schema_version: '1.1'
name: formulate:B37.2
description: A German repo (features/formulate.feature @B37.2)
tags:
- formulate
- R37
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /bdd:formulate docs/discovery/2026-10-13-workouts.md
  max_turns: 10
graders:
- name: asks-german-or-english
  type: regex
  pattern: '# language: de'
  flags: i
  target: last_message
- name: offers-english
  type: regex
  pattern: English|Englisch
  flags: i
  target: last_message
- name: no-feature-yet
  type: file_exists
  path: '**/*.feature'
  exists: false
