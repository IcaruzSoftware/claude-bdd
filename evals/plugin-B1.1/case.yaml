schema_version: "1.1"
name: plugin:B1.1
description: "The user runs only the automation step (features/plugin.feature @B1.1)"
tags: [plugin, R1]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/bdd:automate features/workouts.feature'
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: no-scratchpad
    type: file_exists
    path: "docs/discovery/*.md"
    exists: false
  - name: no-feature-file
    type: file_exists
    path: "**/*.feature"
    exists: false
  - name: no-other-step
    type: tool_used
    tool: Skill
    input_match: 'discover|formulate'
    min: 0
    max: 0
    arm: both
  - name: automation-step-ran
    type: file_exists
    path: "tests/**"
    exists: true
