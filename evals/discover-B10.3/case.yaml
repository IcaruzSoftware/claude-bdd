schema_version: '1.1'
name: discover:B10.3
description: Calling discover again keeps the user's edits (features/discover.feature @B10.3)
tags:
- discover
- R10
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /bdd:discover Workouts
  max_turns: 15
graders:
- name: r3-keeps-user-text
  type: regex
  pattern: '### R3 \S+ Nur Admins und der Coach der eigenen Gruppe dürfen Workouts löschen'
  target:
    source: file
    path: docs/discovery/2026-10-13-workouts.md
- name: no-language-question
  type: regex
  pattern: (German|Deutsch)[^\n]*(English|Englisch)\s*\?
  flags: i
  match: not_contains
  target: last_message
- name: scratchpad-not-rewritten
  type: tool_used
  tool: Write
  input_match: 2026-10-13-workouts\.md
  min: 0
  max: 0
- name: scratchpad-edited
  type: tool_used
  tool: Edit
  input_match: 2026-10-13-workouts\.md
  min: 1
