schema_version: '1.1'
name: discover:B25.2
description: A German repo with an English-speaking user (features/discover.feature @B25.2)
tags:
- discover
- R25
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/bdd:discover workout sharing: coaches send a planned workout to the athletes of their group'
  max_turns: 10
graders:
- name: asks-language-once
  type: regex
  pattern: 'Scratchpad and feature file in German or English\?'
  match: count:1
  target: last_message
- name: no-scratchpad-written
  type: tool_used
  tool: Write
  input_match: '# Example Map'
  min: 0
  max: 0
- name: no-discovery-file
  type: file_exists
  path: docs/discovery/**
  exists: false
