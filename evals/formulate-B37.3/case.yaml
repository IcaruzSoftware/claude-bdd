schema_version: '1.1'
name: formulate:B37.3
description: The language was chosen in discover (features/formulate.feature @B37.3)
tags:
- formulate
- R37
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /bdd:formulate docs/discovery/2026-10-13-workouts.md
  max_turns: 15
graders:
- name: feature-written
  type: file_exists
  path: features/workouts.feature
  exists: true
- name: german-gherkin
  type: regex
  pattern: '^# language: de\b'
  target:
    source: file
    path: features/workouts.feature
- name: german-keywords
  type: regex
  pattern: '^\s*Regel:'
  flags: m
  target:
    source: file
    path: features/workouts.feature
- name: no-language-question
  type: regex
  pattern: 'or (?:in )?English\?|oder (?:auf )?Englisch\?'
  flags: i
  match: not_contains
  target: last_message
