schema_version: "1.1"
name: automate:B57.3
description: "The planned code does not exist yet (features/automate.feature @B57.3) - runs tests: needs --allow-tools Bash"
tags: [automate, R57, needs-bash]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/bdd:automate features/sharing.feature'
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
graders:
  - name: ran-the-suite
    type: tool_used
    tool: Bash
    input_match: 'unittest'
    min: 1
  - name: reports-missing-symbol
    type: regex
    target: last_message
    pattern: 'red: `?share_workout`? does not exist yet'
    match: contains
  - name: checks-intent
    type: llm
    focus: trace
    criteria: |
      PASS if Claude checks the intention of the sharing B1.1 test against its example and states that
      the test asserts that Carl sees the shared workout ("Intervals") in his workout list.
      FAIL if it never looks at what the test asserts, or changes the test's assertion.
  - name: no-new-production-file
    type: file_exists
    path: "coach/**"
    exists: false
  - name: no-production-code
    type: regex
    target: {source: file, path: coach/workouts.py}
    pattern: 'share_workout'
    match: not_contains
