schema_version: "1.1"
name: automate:B52.1
description: "An unbound feature file (features/automate.feature @B52.1)"
tags: [automate, R52]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/bdd:automate features/workouts.feature'
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: reports-sharing-not-bound
    type: regex
    target: last_message
    pattern: 'features/sharing\.feature[^\n]*not bound|not bound[^\n]*features/sharing\.feature'
    flags: 'i'
    match: contains
