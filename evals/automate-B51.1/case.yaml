schema_version: "1.1"
name: automate:B51.1
description: "A project with a BDD runner (features/automate.feature @B51.1)"
tags: [automate, R51]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/bdd:automate features/workouts.feature'
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: new-behave-step-module
    type: file_exists
    path: "features/steps/*.py"
    exists: true
  - name: writes-behave-steps
    type: tool_used
    tool: Write
    input_match: 'from behave import'
    min: 1
  - name: does-not-ask
    type: regex
    target: last_message
    pattern: '\binstall\b[^?\n]*\?|\bdependency\?'
    flags: 'i'
    match: not_contains
  - name: no-second-suite
    type: file_exists
    path: "tests/**"
    exists: false
