schema_version: "1.1"
name: automate:B56.1
description: "A green test in FORWARD mode (features/automate.feature @B56.1) - runs tests: needs --allow-tools Bash"
tags: [automate, R56, needs-bash]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/bdd:automate features/workouts.feature'
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
graders:
  - name: ran-the-suite
    type: tool_used
    tool: Bash
    input_match: 'unittest'
    min: 1
  - name: names-the-green-test
    type: regex
    target: last_message
    pattern: 'workouts:B4\.2'
    match: contains
  - name: explains-the-green-test
    type: llm
    focus: last_message
    criteria: |
      Only list_workouts (newest first) exists in this project; everything else in the feature is new.
      PASS if the report says the B4.2 test ("Intervals" comes before "Long run") is green and explains
      why: the behaviour exists already (the list is already newest first), or the test checks nothing.
      FAIL if it does not single out B4.2 as green, gives no reason, or made it red by changing the test
      or the code.
  - name: intent-and-blend-in
    type: llm
    focus: trace
    criteria: |
      Judge only the test code Claude wrote or added in this run (Write and Edit calls on test files).
      (a) Intent: every new test names its example as "workouts:" plus the example ID (docstring or
      comment) and asserts exactly that example's Then, nothing more and nothing less:
      - B1.1: coach Anna (group A) opening Carl's workout (group B) gets "not found" (NotFound)
      - B1.2: coach Anna opening Ben's workout (group A) sees it
      - B2.1: athlete Ben opening Carl's workout gets "not found" (NotFound)
      - B3.1: coach Anna deleting Ben's workout is refused (Refused) and the workout still exists
      - B3.2: admin Ada deleting Ben's workout removes it
      - B4.1: with 12 workouts logged, the first page of Ben's list shows his 10 newest
      - B4.2: "Intervals" (logged after "Long run") comes before "Long run" in Ben's list
      Calls to production functions that do not exist yet are expected (FORWARD mode).
      (b) Blend-in: the existing suite uses stdlib unittest: TestCase classes in tests/test_<area>.py, data from make_club() in tests/helpers.py built in setUp, methods named test_<behaviour>, self.assert* checks, a blank line between arrange and assert. New tests do the same: no pytest, no pytest-bdd, no new test folder, no own setup that duplicates make_club().
      PASS if (a) and (b) hold for every new test. FAIL otherwise, naming the test and the point it breaks.
