schema_version: "1.1"
name: automate:B50.1
description: "A pytest-bdd project (features/automate.feature @B50.1)"
tags: [automate, R50]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/bdd:automate features/workouts.feature'
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: writes-pytest-bdd-step-definitions
    type: tool_used
    tool: Write
    input_match: 'from pytest_bdd import[\s\S]*@(given|when|then)\('
    min: 1
