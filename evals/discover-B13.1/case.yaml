schema_version: '1.1'
name: discover:B13.1
description: A guess becomes a statement (features/discover.feature @B13.1)
tags:
- discover
- R13
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /bdd:discover workout visibility in the coach app
  max_turns: 15
graders:
- name: states-guess
  type: tool_used
  tool: Write
  input_match: '### R\d+ \? [Aa]thletes? sees? only (?:their|his|her) own workouts'
  min: 1
- name: no-open-question-in-file
  type: tool_used
  tool: Write
  input_match: '[Ww]ho can see (?:the )?workouts\?'
  min: 0
  max: 0
- name: no-open-question-in-reply
  type: regex
  pattern: Who can see (?:the )?workouts\?
  flags: i
  match: not_contains
  target: last_message
