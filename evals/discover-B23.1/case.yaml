schema_version: '1.1'
name: discover:B23.1
description: A small request stays a small request (features/discover.feature @B23.1)
tags:
- discover
- R23
context:
  scaffold_script: scaffold.sh
execution:
  prompt: add a delete button
  max_turns: 15
graders:
- name: discover-not-started
  type: tool_used
  tool: Skill
