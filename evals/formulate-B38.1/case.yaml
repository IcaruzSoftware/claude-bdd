schema_version: '1.1'
name: formulate:B38.1
description: A business step, not a UI step (features/formulate.feature @B38.1)
tags:
- formulate
- R38
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /bdd:formulate docs/discovery/2026-10-13-workouts.md
  max_turns: 15
graders:
- name: declarative-step
  type: regex
  pattern: ^\s*When (?:coach )?Anna opens Carl's workout
  flags: m
  target:
    source: file
    path: features/workouts.feature
- name: no-ui-steps
  type: regex
  pattern: ^\s*(?:Given|When|Then|And|But)\b[^\n]*(?:click|#workout|/workouts|https?:)
  flags: im
  match: not_contains
  target:
    source: file
    path: features/workouts.feature
